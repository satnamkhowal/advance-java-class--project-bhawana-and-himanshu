
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MyPlatform</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #eff6ff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 525px;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            margin-bottom: 35px;
        }

        .logo-box {
            background: #0d5bf2;
            color: white;
            width: 60px;
            height: 63px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            border-radius: 12px;
        }

        .logo h3 {
            color: #174b9b;
            font-weight: bold;
            margin: 0;
        }

        .heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .heading h2 {
            font-weight: bold;
            color: #111;
        }

        .heading p {
            color: #64748b;
            font-size: 19px;
            margin-top: 15px;
        }

        .form-label {
            font-weight: bold;
            color: #24344d;
        }

        .form-control {
            height: 56px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 12px 16px;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #0d5bf2;
            box-shadow: 0 0 5px rgba(13,91,242,0.2);
        }

        .login-btn {
            background: #155eef;
            color: white;
            width: 100%;
            height: 57px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        .login-btn:hover {
            background: #0645c7;
            color: white;
        }

        .forgot-link,
        .register-link {
            color: #075cf5;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom-text {
            text-align: center;
            margin-top: 32px;
            color: #64748b;
        }

        .back-home {
            text-align: center;
            margin-top: 28px;
        }

        .back-home a {
            color: #64748b;
            text-decoration: none;
        }

        @media(max-width: 576px) {
            .login-card {
                padding: 30px 22px;
            }
        }

    </style>
</head>

<body>

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">

            <div class="logo-box">
                M
            </div>

            <h3>MyPlatform</h3>

        </div>


        <!-- Heading -->
        <div class="heading">

            <h2>Welcome Back!</h2>

            <p>Please login to your account.</p>

        </div>


        <!-- Error Message -->
        <div id="errorMessage"
             class="alert alert-danger d-none">

            Invalid Email or Password!

        </div>


        <!-- Login Form -->
        <form action="LoginServlet" method="post">

            <!-- Email -->
            <div class="mb-4">

                <label class="form-label">
                    Email Address
                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

            </div>


            <!-- Remember and Forgot Password -->
            <div class="d-flex justify-content-between
                        align-items-center mb-3">

                <div class="form-check">

                    <input type="checkbox"
                           class="form-check-input"
                           id="remember">

                    <label class="form-check-label"
                           for="remember">

                        Remember me

                    </label>

                </div>

                <a href="#" class="forgot-link">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->
            <button type="submit" class="login-btn">

                Login

            </button>

        </form>


        <!-- Register Link -->
        <div class="bottom-text">

            Don't have an account?

            <a href="register.html"
               class="register-link">

                Register Now

            </a>

        </div>


        <!-- Back to Home -->
        <div class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- Error Message Script -->
    <script>

        const params = new URLSearchParams(window.location.search);

        if (params.get("error") === "invalid") {

            document.getElementById("errorMessage")
                .classList.remove("d-none");

            document.getElementById("errorMessage")
                .innerText = "Invalid Email or Password!";

        }

        if (params.get("error") === "empty") {

            document.getElementById("errorMessage")
                .classList.remove("d-none");

            document.getElementById("errorMessage")
                .innerText = "Please enter Email and Password.";

        }

    </script>

</body>
</html>
